[pytest]
testpaths = test
markers =
    lammps: needs a configured LAMMPS binary + plugin (auto-skips otherwise)
    v2: tests for the isolated sog.v2 PyTorch-2.x deployment layer
    torch_op: needs the sogkspace custom-op library (auto-skips otherwise)
    cuda: needs a usable CUDA device
    aoti: needs TorchInductor/AOTI compilation (auto-skips otherwise)
    slow: long-running check
addopts = --strict-markers
